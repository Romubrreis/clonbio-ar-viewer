<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CLONBIO – Industrial AR Viewer</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background-color: #f4f4f4; }

    header {
      background-color: #c62828;
      color: #fff;
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      text-align: left;
    }

    main {
      max-width: 1100px;
      margin: 20px auto;
      background-color: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    }

    .info {
      margin-top: 15px;
      background-color: #eee;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }

    .viewer-wrap { position: relative; }

    model-viewer {
      width: 100%;
      height: 600px;
      background-color: #111;
      border-radius: 12px;

      /* improves gestures in AR */
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* BIG overlay visible ON TOP of AR (only works in WebXR in-browser) */
    .ar-hud {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(0,0,0,.55);
      color: #fff;
      padding: 12px 14px;
      border-radius: 14px;
      backdrop-filter: blur(6px);
      pointer-events: none;
      min-width: 220px;
      display: none; /* shown only while presenting AR in-browser */
    }
    .ar-hud .title { font-size: 12px; opacity: .85; }
    .ar-hud .scale {
      font-size: 34px;
      font-weight: 900;
      line-height: 1.0;
      margin-top: 2px;
    }
    .ar-hud .sub { font-size: 14px; opacity: .95; margin-top: 4px; }
    .ar-hud .tag {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      font-size: 14px;
      font-weight: 900;
    }

    /* Photo button overlay (only in WebXR in-browser) */
    .photo-btn {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 10;
      border: none;
      border-radius: 14px;
      padding: 12px 14px;
      background: rgba(198,40,40,.95);
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      display: none; /* shown only while presenting AR in-browser */
    }
  </style>
</head>

<body>
  <header>CLONBIO – Industrial AR Viewer</header>

  <main>
    <p class="info">
      ✔ Open on your phone/tablet<br>
      ✔ Tap <b>AR</b><br>
      ✔ Gestures: <b>drag</b> move, <b>pinch</b> scale, <b>two fingers</b> rotate<br>
      ✔ NOTE: The big scale HUD + Photo button only appear when AR runs <b>inside the browser (WebXR)</b>.
    </p>

    <div class="viewer-wrap">
      <!-- HUD shown only in WebXR AR -->
      <div class="ar-hud" id="hud">
        <div class="title">Scale (AR)</div>
        <div class="scale" id="hudScale">--</div>
        <div class="sub" id="hudPct">--</div>
        <div class="tag" id="hudOneOne" style="display:none;">1:1</div>
      </div>

      <button class="photo-btn" id="photoBtn">PHOTO</button>

      <model-viewer
        id="viewer"
        src="BBC_Outside_Platform_4.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-placement="floor"
        ar-scale="auto"
        camera-controls
        environment-image="neutral"
        exposure="1.0"
        bounds="tight"
        loading="eager"
        interaction-prompt="auto">
      </model-viewer>
    </div>
  </main>

  <script>
    const viewer = document.getElementById('viewer');
    const hud = document.getElementById('hud');
    const hudScale = document.getElementById('hudScale');
    const hudPct = document.getElementById('hudPct');
    const hudOneOne = document.getElementById('hudOneOne');
    const photoBtn = document.getElementById('photoBtn');

    // Improve gestures (only within viewer)
    viewer.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

    // We track the "base scale" we apply. (Pinch in AR may change it internally depending on mode.)
    let baseScale = 1.0;

    function updateHud() {
      hudScale.textContent = `${baseScale.toFixed(2)}x`;
      hudPct.textContent = `${Math.round(baseScale * 100)}%`;
      const isOneOne = Math.abs(baseScale - 1.0) <= 0.02;
      hudOneOne.style.display = isOneOne ? 'inline-block' : 'none';
    }

    function setScaleUniform(s) {
      baseScale = s;
      viewer.setAttribute('scale', `${s} ${s} ${s}`);
      updateHud();
    }

    // Start smaller when AR starts (you can change this default)
    const START_SMALL = 0.20;

    viewer.addEventListener('ar-status', (e) => {
      const s = e.detail.status;

      if (s === 'session-started') {
        // If it is WebXR in-browser, show HUD + photo button
        // (In Scene Viewer / Quick Look these won't show because you're leaving the page)
        hud.style.display = 'block';
        photoBtn.style.display = 'block';

        // Start smaller
        setScaleUniform(START_SMALL);
      }

      if (s === 'not-presenting') {
        hud.style.display = 'none';
        photoBtn.style.display = 'none';
      }
    });

    // Photo (best-effort): captures the viewer canvas
    function downloadBlob(blob, filename) {
      const a = document.createElement('a');
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    photoBtn.addEventListener('click', async () => {
      try {
        const dataUrl = await viewer.toDataURL('image/png');
        const res = await fetch(dataUrl);
        const blob = await res.blob();
        downloadBlob(blob, `clonbio_ar_photo_${Date.now()}.png`);
      } catch (err) {
        alert('Photo capture is not supported on this browser. Use device screenshot instead.');
      }
    });

    // Init HUD values
    setScaleUniform(1.0);
  </script>
</body>
</html>
