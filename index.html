<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CLONBIO – Industrial AR Viewer</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body { margin:0; font-family: Arial, Helvetica, sans-serif; background-color:#f4f4f4; }
    header { background-color:#c62828; color:#fff; padding:16px; font-size:20px; font-weight:bold; text-align:left; }

    main {
      max-width:1100px; margin:20px auto; background-color:#fff; padding:20px;
      border-radius:12px; box-shadow:0 4px 18px rgba(0,0,0,0.12);
    }

    .info {
      margin-top:15px; background-color:#eee; padding:12px;
      border-radius:8px; font-size:14px; line-height:1.4;
    }

    .viewer-wrap { position:relative; }

    model-viewer {
      width:100%;
      height:600px;
      background-color:#111;
      border-radius:12px;

      touch-action:none;
      -webkit-user-select:none;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }

    .crosshair {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      width:18px; height:18px;
      border:2px solid rgba(255,255,255,.75);
      border-radius:50%;
      pointer-events:none;
      z-index:3;
      box-shadow:0 0 0 2px rgba(0,0,0,.25);
    }
    .crosshair::before,.crosshair::after{
      content:""; position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      background: rgba(255,255,255,.75);
    }
    .crosshair::before{ width:10px; height:2px; }
    .crosshair::after{ width:2px; height:10px; }

    .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:12px 0 0; }
    button {
      border:none; border-radius:10px; padding:10px 12px;
      background:#c62828; color:#fff; font-weight:bold; cursor:pointer;
    }
    button.secondary { background:#333; }

    .status {
      margin-top:10px;
      background:#f7f7f7;
      border:1px solid #eee;
      padding:10px 12px;
      border-radius:10px;
      font-size:12px;
      line-height:1.35;
      color:#222;
    }

    /* ===== PHOTO BUTTON (visible only during in-browser AR / WebXR) ===== */
    .photo-btn {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 10;
      border: none;
      border-radius: 14px;
      padding: 12px 14px;
      background: rgba(198,40,40,.95);
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      display: none; /* shown when AR is presenting in-browser */
    }
  </style>
</head>

<body>
  <header>CLONBIO – Industrial AR Viewer</header>

  <main>
    <p class="info">
      ✔ Tap <strong>AR</strong><br>
      ✔ Gestures: <strong>drag</strong> (move), <strong>pinch</strong> (scale), <strong>two fingers</strong> (rotate)<br>
      ✔ The model will start small — scale up as needed
    </p>

    <div class="controls">
      <button id="compactBtn" class="secondary">Compact Start: ON</button>
      <button id="realBtn">Real Scale (1:1)</button>
    </div>

    <div class="viewer-wrap">
      <div class="crosshair"></div>

      <!-- Photo button overlay (only appears during in-browser AR / WebXR) -->
      <button class="photo-btn" id="photoBtn">PHOTO</button>

      <model-viewer
        id="viewer"
        src="BBC_Outside_Platform_4.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-placement="floor"
        ar-scale="auto"
        camera-controls
        environment-image="neutral"
        exposure="1.0"
        shadow-intensity="0.8"
        bounds="tight"
        loading="eager"
        interaction-prompt="auto">
      </model-viewer>
    </div>

    <div class="status" id="status">
      Tip: Start small, place it easily, then pinch to scale up.
    </div>
  </main>

  <script>
    const viewer = document.getElementById('viewer');
    const compactBtn = document.getElementById('compactBtn');
    const realBtn = document.getElementById('realBtn');
    const statusEl = document.getElementById('status');
    const photoBtn = document.getElementById('photoBtn');

    viewer.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

    // --- Compact scale logic (universal) ---
    const TARGET_MAX_DIM_METERS = 0.8;
    const COMPACT_MIN = 0.03;
    const COMPACT_MAX = 1.0;

    const FALLBACK_COMPACT = 0.15;

    let compactOn = true;
    let compactScale = FALLBACK_COMPACT;

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function setScaleUniform(s) { viewer.setAttribute('scale', `${s} ${s} ${s}`); }

    function applyCompactNow() {
      setScaleUniform(compactScale);
    }

    function setCompact(on) {
      compactOn = on;
      if (on) {
        applyCompactNow();
        compactBtn.textContent = 'Compact Start: ON';
        compactBtn.classList.add('secondary');
        statusEl.innerHTML = `Compact start ON — initial scale: <b>${compactScale.toFixed(3)}x</b>. Pinch to scale up.`;
      } else {
        setScaleUniform(1.0);
        compactBtn.textContent = 'Compact Start: OFF';
        compactBtn.classList.remove('secondary');
        statusEl.innerHTML = 'Real scale (1:1). Pinch to fine-tune.';
      }
    }

    compactBtn.addEventListener('click', () => setCompact(!compactOn));
    realBtn.addEventListener('click', () => setCompact(false));

    function computeCompactScale() {
      try {
        const d = viewer.getDimensions?.(); // meters
        if (!d) return false;

        const maxDim = Math.max(d.x, d.y, d.z);
        if (!isFinite(maxDim) || maxDim <= 0) return false;

        compactScale = clamp(TARGET_MAX_DIM_METERS / maxDim, COMPACT_MIN, COMPACT_MAX);

        statusEl.innerHTML =
          `Model loaded. Approx size: <b>${d.x.toFixed(2)}m</b> × <b>${d.y.toFixed(2)}m</b> × <b>${d.z.toFixed(2)}m</b>. ` +
          `Initial compact scale: <b>${compactScale.toFixed(3)}x</b>.`;

        if (compactOn) applyCompactNow();
        return true;
      } catch {
        compactScale = FALLBACK_COMPACT;
        return false;
      }
    }

    viewer.addEventListener('load', () => {
      const ok = computeCompactScale();
      if (!ok) {
        compactScale = FALLBACK_COMPACT;
        if (compactOn) applyCompactNow();
        statusEl.textContent = `Model loaded. Using fallback compact start: ${compactScale.toFixed(2)}x.`;
      }
    });

    // IMPORTANT: when AR session starts, force the compact start scale
    // Also: show/hide PHOTO button only while presenting in-browser AR (WebXR)
    viewer.addEventListener('ar-status', (e) => {
      const s = e.detail.status; // not-presenting | session-started | object-placed | failed

      if (s === 'session-started') {
        if (compactOn) applyCompactNow();
        statusEl.textContent = 'AR started. The model starts smaller — pinch to scale up.';
        photoBtn.style.display = 'block';
      }

      if (s === 'object-placed') {
        statusEl.textContent = 'Placed! Drag=move, pinch=scale, two fingers=rotate.';
      }

      if (s === 'failed') {
        statusEl.textContent = 'AR failed. Try better lighting and a textured floor.';
        photoBtn.style.display = 'none';
      }

      if (s === 'not-presenting') {
        photoBtn.style.display = 'none';
      }
    });

    // ===== PHOTO (best-effort inside WebXR) =====
    // Note: Depending on device/browser, this may capture only the model render (not the camera background).
    function downloadBlob(blob, filename) {
      const a = document.createElement('a');
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    photoBtn.addEventListener('click', async () => {
      try {
        const dataUrl = await viewer.toDataURL('image/png');
        const res = await fetch(dataUrl);
        const blob = await res.blob();
        downloadBlob(blob, `clonbio_ar_photo_${Date.now()}.png`);
      } catch (err) {
        alert('Photo capture is not supported on this browser. Use device screenshot instead.');
      }
    });

    // Start with compact ON by default
    setCompact(true);
  </script>
</body>
</html>
